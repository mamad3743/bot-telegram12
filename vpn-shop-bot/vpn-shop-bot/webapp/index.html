<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>فروشگاه VPN</title>
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="menu" id="menu">

    <button class="btn btn-green btn-full" data-action="buy">
      <span class="label">🛒 خرید سرویس جدید</span>
      <span class="emoji">✨</span>
    </button>

    <div class="row">
      <button class="btn btn-blue" data-action="services">
        <span class="label">📦 سرویس‌های من</span>
        <span class="emoji">🤖</span>
      </button>
      <button class="btn btn-blue" data-action="wallet">
        <span class="label">💰 کیف پول</span>
        <span class="dot dot-purple"></span>
      </button>
    </div>

    <button class="btn btn-red btn-full" data-action="invite">
      <span class="label">🎉 دعوت دوستان</span>
      <span class="dot dot-orange"></span>
    </button>

    <button class="btn btn-blue btn-full" data-action="support">
      <span class="label">🎧 پشتیبانی</span>
      <span class="dot dot-blue"></span>
    </button>

    <div class="row">
      <button class="btn btn-blue" data-action="guide">
        <span class="label">❓ راهنما</span>
        <span class="dot dot-white"></span>
      </button>
      <button class="btn btn-blue" data-action="about">
        <span class="label">ℹ️ درباره ما</span>
        <span class="dot dot-white"></span>
      </button>
    </div>

  </div>

<script src="app.js"></script>
</body>
</html>
